openapi: 3.1.1
info:
  title: MangaScrapper.Api | v1
  version: 1.0.0
servers:
  - url: http://11.1.1.4:5009/
paths:
  /api/v1/manga/{id}/thumbnail:
    patch:
      tags:
        - Manga
      summary: Update manga thumbnail from a remote URL
      operationId: UpdateMangaThumbnail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThumbnailRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfMangaSummaryResponse"
  /api/v1/manga/{id}/thumbnail/upload:
    post:
      tags:
        - Manga
      summary: Upload manga thumbnail file directly
      operationId: UploadMangaThumbnail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  $ref: "#/components/schemas/IFormFile"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfMangaSummaryResponse"
  /api/v1/manga/{id}:
    patch:
      tags:
        - Manga
      summary: Update manga details
      operationId: UpdateManga
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMangaCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
    get:
      tags:
        - Manga
      summary: Get manga details by ID
      operationId: GetMangaById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfMangaSummaryResponse"
  /api/v1/manga/search/semantic:
    get:
      tags:
        - Manga
      summary: Multilingual semantic search using vector embeddings (100+ languages
        including Indonesian)
      operationId: SemanticSearchManga
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfMangaSummaryResponse"
  /api/v1/manga:
    get:
      tags:
        - Manga
      summary: Get paged list of manga
      operationId: GetPagedManga
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
        - name: sortBy
          in: query
          schema:
            type: string
            default: updatedAt
        - name: orderBy
          in: query
          schema:
            type: string
            default: desc
        - name: nsfw
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfPagedResponseOfMangaSummaryResponse"
  /api/v1/manga/trending:
    get:
      tags:
        - Manga
      summary: Get Trending Manga
      operationId: GetTrending
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfPagedResponseOfMangaSummaryResponse"
  /api/v1/manga/{mangaId}/similar/filtered:
    get:
      tags:
        - Manga
      summary: Get mangas similar to a given manga filtered by status, type, or genres
      operationId: GetSimilarMangaFiltered
      parameters:
        - name: mangaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfMangaSummaryResponse"
  /api/v1/manga/{mangaId}/similar:
    get:
      tags:
        - Manga
      summary: Get mangas semantically similar to a given manga using vector search
      operationId: GetSimilarManga
      parameters:
        - name: mangaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfMangaSummaryResponse"
  /api/v1/manga/similar/by-category:
    get:
      tags:
        - Manga
      summary: Get mangas similar by category / tropes with optional status, type, and
        genres filtering
      operationId: GetSimilarMangaByCategory
      parameters:
        - name: categories
          in: query
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: array
            items:
              type: string
        - name: excludeMangaId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfMangaSummaryResponse"
    post:
      tags:
        - Manga
      summary: Get mangas similar by category / tropes with optional status, type, and
        genres filtering via body
      operationId: PostSimilarMangaByCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimilarByCategoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfMangaSummaryResponse"
  /api/v1/manga/{mangaId}/similar/by-category:
    get:
      tags:
        - Manga
      summary: Get mangas similar to a given manga's categories / tropes with optional
        status, type, and genres filtering
      operationId: GetSimilarMangaByIdCategories
      parameters:
        - name: mangaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfMangaSummaryResponse"
  /api/v1/manga/recomendations:
    get:
      tags:
        - Manga
      summary: Get manga recomendations by
      operationId: GetRecomendation
      parameters:
        - name: readingHistoryIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfMangaSummaryResponse"
  /api/v1/manga/{mangaId}/chapters/{chapterId}:
    get:
      tags:
        - Manga
      summary: Get single chapters for a manga
      operationId: GetChapters
      parameters:
        - name: mangaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfChapterResponse"
  /api/v1/manga/types:
    get:
      tags:
        - Manga
      summary: Get list of available manga types
      operationId: GetAllType
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfstring"
  /api/v1/manga/genres:
    get:
      tags:
        - Manga
      summary: Get list of available genres
      operationId: GetAllGenre
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfstring"
  /api/v1/manga/{mangaId}/chapters:
    get:
      tags:
        - Manga
      summary: Get all chapters for a manga
      operationId: GetAllChapters
      parameters:
        - name: mangaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfChapterResponse"
  /api/v1/manga/recommend/advanced:
    post:
      tags:
        - Manga
      summary: Recommend manga using positive (liked) and negative (disliked) examples
        via Qdrant native vector arithmetic
      operationId: GetAdvancedRecommendation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvancedRecommendationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfMangaSummaryResponse"
  /api/v1/manga/{mangaId}:
    delete:
      tags:
        - Manga
      summary: Delete a manga
      operationId: DeleteManga
      parameters:
        - name: mangaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
  /api/v1/manga/{mangaId}/chapter/{chapterId}:
    delete:
      tags:
        - Manga
      summary: Delete a manga chapter
      operationId: DeleteChapter
      parameters:
        - name: mangaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
  /api/v1/images/proxy:
    get:
      tags:
        - Images
      summary: Proxy remote image requests
      operationId: ProxyImage
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Get authenticated user info
      operationId: UserInfo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfUserInfoResponse"
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user account
      operationId: Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfLoginResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: User logout — clears cookie session
      operationId: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfLoginResponse"
  /api/v1/auth/firebase:
    post:
      tags:
        - Auth
      summary: Authenticate via Firebase ID token
      operationId: FirebaseVerify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirebaseVerifyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfLoginResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/users/fcm-token:
    delete:
      tags:
        - Users
      summary: Unregister device FCM token upon logout
      operationId: UnregisterFcmToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnregisterFcmTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfstring"
    post:
      tags:
        - Users
      summary: Register device FCM token for push notifications
      operationId: RegisterFcmToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterFcmTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfstring"
  /api/v1/users/heartbeat:
    patch:
      tags:
        - Users
      description: Patch user heartbeat
      operationId: PatchUserHearthbeat
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfUserHeartbeatResponse"
  /api/v1/users/{userId}:
    get:
      tags:
        - Users
      description: Get user by id
      operationId: GetUserById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfUserResponse"
  /api/v1/users:
    get:
      tags:
        - Users
      description: Get paged users
      operationId: GetPagedUser
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
        - name: sortBy
          in: query
          schema:
            type: string
            default: updatedAt
        - name: orderBy
          in: query
          schema:
            type: string
            default: desc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfPagedResponseOfUserResponse"
  /api/v1/user-progression:
    post:
      tags:
        - UserProgression
      operationId: UpdateUserProgression
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProgressionCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfUserProgressionResponse"
  /api/v1/user-progression/{userId}:
    get:
      tags:
        - UserProgression
      operationId: GetUserProgression
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfUserProgressionResponse"
  /api/v1/user-progression/{userId}/{mangaId}:
    get:
      tags:
        - UserProgression
      operationId: GetMangaProgression
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: mangaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfUserProgressionResponse"
  /api/v1/user-library/{id}:
    delete:
      tags:
        - UserLibrary
      operationId: RemoveUserLibrary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /api/v1/user-library:
    get:
      tags:
        - UserLibrary
      operationId: GetUserLibrary
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: isFavorite
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            default: UpdatedAt
        - name: orderBy
          in: query
          schema:
            type: string
            default: desc
        - name: page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfPagedResponseOfUserLibraryResponse"
    post:
      tags:
        - UserLibrary
      operationId: AddUserLibrary
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrUpdateUserLibraryCommand"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/user-library/all:
    get:
      tags:
        - UserLibrary
      operationId: GetAllUserLibrary
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfListOfUserLibraryResponse"
  /api/v1/scrapper/mangaupdates/search:
    get:
      tags:
        - Scrapper
      operationId: SearchMangaUpdates
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/scrapper/jikan/search:
    get:
      tags:
        - Scrapper
      operationId: SearchJikanManga
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/scrapper/anilist/search:
    get:
      tags:
        - Scrapper
      operationId: SearchAnilistManga
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/scrapper/manga/{mangaId}/chapter-pages:
    get:
      tags:
        - Scrapper
      operationId: ScrapChapterPages
      parameters:
        - name: mangaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /api/v1/scrapper/processes:
    get:
      tags:
        - Scrapper
      operationId: GetScrapingProcesses
      responses:
        "200":
          description: OK
  /api/v1/scrapper/cancel:
    post:
      tags:
        - Scrapper
      operationId: CancelScrapingProcess
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelScrapingRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/scrapper/purge:
    post:
      tags:
        - Scrapper
      operationId: PurgeScrapingQueue
      responses:
        "200":
          description: OK
  /api/v1/scrapper/queue:
    get:
      tags:
