name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Test and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create mock .env file
        run: |
          touch .env
          echo "BASE_URL=https://api.example.com" >> .env
          echo "FIREBASE_PROJECT_ID=dummy" >> .env
          echo "FIREBASE_SENDER_ID=dummy" >> .env
          echo "FIREBASE_STORAGE_BUCKET=dummy" >> .env
          echo "FIREBASE_WEB_API_KEY=dummy" >> .env
          echo "FIREBASE_WEB_APP_ID=dummy" >> .env
          echo "FIREBASE_ANDROID_API_KEY=dummy" >> .env
          echo "FIREBASE_ANDROID_APP_ID=dummy" >> .env
          echo "FIREBASE_IOS_API_KEY=dummy" >> .env
          echo "FIREBASE_IOS_APP_ID=dummy" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test
